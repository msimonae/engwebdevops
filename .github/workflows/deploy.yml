# Nome do seu pipeline
name: Test, Build and Deploy React App

# Gatilho
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões
permissions:
  contents: read
  pages: write
  id-token: write

# Tarefas (Jobs)
jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Passo 1: Baixar o código
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Instalar o Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Passo 3: Instalar as dependências
      - name: Install dependencies
        run: npm install

      # ======================================================
      # === CORREÇÃO ESTÁ AQUI ===
      # ======================================================
      - name: Run unit tests
        env: # <--- Adicionamos esta seção
          CI: true
        run: npm test # <--- Removemos o '--watchAll=false'
      # Isso força o create-react-app a rodar os testes
      # apenas uma vez e sair sem modo interativo.

      # Passo 5: Construir o site (só roda se os testes passarem)
      - name: Build project
        run: npm run build

      # Passo 6: Preparar o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Passo 7: Fazer o upload do site pronto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      # Passo 8: Publicar o site!
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
